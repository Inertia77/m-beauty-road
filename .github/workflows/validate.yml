name: Validate archive
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install Pillow jsonschema playwright
      - name: Validate archive data and media
        run: python scripts/validate.py
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Browser regression
        run: python scripts/test_browser.py
