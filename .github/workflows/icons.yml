name: Build PWA icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/icon-source.svg"
      - "scripts/generate_icons.py"
      - ".github/workflows/icons.yml"

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install icon renderer
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Generate icon variants
        run: python scripts/generate_icons.py

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png assets/apple-touch-icon-180.png assets/maskable-icon-512.png
          if git diff --cached --quiet; then
            echo "Icons already up to date."
          else
            git commit -m "chore: regenerate PWA icons"
            git push
          fi
